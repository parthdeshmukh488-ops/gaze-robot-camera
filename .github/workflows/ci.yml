name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Test
        run: pytest --cov=gazectl --cov-report=term-missing

      # The examples are the numbers quoted in the README. Running them in CI
      # is what stops those numbers drifting away from what the code does.
      - name: Run examples
        run: |
          python examples/01_calibration_accuracy.py
          python examples/02_filter_tradeoff.py
          python examples/03_technique_comparison.py
